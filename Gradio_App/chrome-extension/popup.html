<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #f6f8fc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --teal: #0d9488;
      --teal-dark: #0f766e;
      --teal-soft: #ccfbf1;
      --amber: #b45309;
      --amber-soft: #fef3c7;
      --red: #dc2626;
      --red-soft: #fee2e2;
      --green: #16a34a;
      --green-soft: #dcfce7;
    }
    * { box-sizing: border-box; }
    body {
      width: 380px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .topbar {
      height: 5px;
      background: linear-gradient(90deg, var(--teal), #14b8a6, #f59e0b);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 0;
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 800;
      letter-spacing: .5px;
      color: var(--teal-dark);
    }
    .version {
      font-size: 10px;
      font-weight: 700;
      color: var(--teal);
      background: var(--teal-soft);
      padding: 3px 9px;
      border-radius: 999px;
    }
    .content { padding: 10px 16px 14px; }
    #hint {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
      background: #fffbea;
      border: 1px dashed #fcd34d;
      border-radius: 8px;
      padding: 8px 10px;
      margin: 10px 0 12px;
    }
    button {
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform .12s, filter .12s, background .15s;
    }
    button:hover:not(:disabled) { filter: brightness(1.05); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .55; cursor: wait; }
    #settings {
      font-size: 10px;
      font-weight: 700;
      color: var(--teal-dark);
      background: var(--teal-soft);
      padding: 5px 10px;
      border-radius: 999px;
      letter-spacing: .3px;
    }
    #settings:hover { background: #99f6e4; }
    #scan {
      width: 100%;
      padding: 11px;
      background: linear-gradient(90deg, var(--teal), #10b981);
      color: #fff;
      box-shadow: 0 3px 10px rgba(13,148,136,.35);
    }
    .bottom-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .bottom-row button {
      flex: 1;
      padding: 9px;
      background: var(--card);
      color: var(--teal-dark);
      border: 1.5px solid var(--teal);
    }
    .bottom-row button:hover:not(:disabled) { background: var(--teal-soft); }
    #status {
      margin: 10px 0 2px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      background: var(--card);
      border-left: 4px solid var(--border);
      border-radius: 0 8px 8px 0;
      padding: 7px 10px;
      min-height: 15px;
    }
    #status.ok { border-left-color: var(--green); color: var(--green); background: var(--green-soft); }
    #status.error { border-left-color: var(--red); color: var(--red); background: var(--red-soft); }
    #syncStatus {
      margin: 10px 0 2px;
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.5;
      white-space: pre-line;
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--card);
      display: none;
    }
    #syncStatus.show { display: block; }
    #syncStatus.ok { border-color: var(--green); color: var(--green); background: var(--green-soft); }
    #syncStatus.error { border-color: var(--red); color: var(--red); background: var(--red-soft); }
    #result { margin-top: 8px; font-size: 11px; word-break: break-all; }
    #result .item {
      padding: 9px 11px;
      margin-bottom: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--teal);
      border-radius: 10px;
    }
    #result .url { color: var(--teal-dark); font-weight: 700; }
    #result .badge { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 999px; font-weight: 700; font-size: 9.5px; }
    #result .badge-ok { color: var(--green); background: var(--green-soft); }
    #result .badge-error { color: var(--red); background: var(--red-soft); }
    #result .badge-wait { color: var(--amber); background: var(--amber-soft); }
    #result .preview {
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.4;
      max-height: 40px;
      overflow: hidden;
    }
    #author {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 10px;
      color: var(--muted);
    }
    #author .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
    #author b { color: var(--teal-dark); font-weight: 800; }
  </style>
</head>
<body>
  <div class="topbar"></div>
  <div class="header">
    <h1>AnhDuy AUTO-BOT</h1>
    <button id="settings">Cài đặt</button>
  </div>
  <div class="content">
    <div id="hint">Bam "Quet ngay" -> tu dong cuon trang, thu thap cong don (loc trung, khong mat bai cu). So bai/thoi gian cho load cau hinh trong "Cài đặt".</div>
    <button id="scan">Quet ngay (tab group dang mo)</button>
    <div id="status">Chua co du lieu. Mo trang group bat ky.</div>
    <div id="result"></div>
    <div id="syncStatus"></div>
    <div class="bottom-row">
      <button id="sync" class="secondary" disabled>Dong bo len server</button>
      <button id="download" class="secondary" disabled>Tai file txt</button>
      <button id="clear" class="secondary" disabled>Xoa du lieu</button>
    </div>
    <div class="bottom-row">
      <button id="checkApi" class="secondary">Kiem tra API</button>
    </div>
    <div id="author"><span class="dot"></span> Tac gia: <b>AnhDuyDEPTRAI</b></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
